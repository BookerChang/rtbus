# RAK3172T runtime keeps the STM32WL UART available for RTBus native Serial,
# while Zephyr console/log output is routed over SEGGER RTT.
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE=""
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE_INPUT_MAX_LINE_LEN=1024
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=64
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_GPIO=y

# RAK3172T is STM32WL and has no Bluetooth controller.
CONFIG_BT=n

# Match the shared RAK3172 STM32WL runtime layout.
CONFIG_RTBUS_IMAGE_RAM_MAX=4096
CONFIG_RTBUS_LIB=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_RTBUS_NATIVE_API_TABLE_BASE=0x2000FF00

# RAK3172T is STM32WL, not Nordic VDDH/HV.
CONFIG_NORDIC_HV_REGOUT0_3V3=n
