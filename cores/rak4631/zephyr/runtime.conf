# RAK4631 runtime board-local settings.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# RAK4631 runtime emits Zephyr logs over SEGGER RTT. The application serial
# port is board-selected in devicetree and is not used as the Zephyr console.
CONFIG_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y

CONFIG_GPIO=y

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_RTBUS_RUNTIME_THREAD_STACK_SIZE=4096
CONFIG_RTBUS_RUNTIME_SERIAL_RX_BUFFER_SIZE=8192
CONFIG_RTBUS_IMAGE_FLASH_PENDING_MAX=1024


CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_SCRATCH=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE=""
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y

# Set the Nordic HV VDD/GPIO domain and SX1262 TCXO control to 3.3 V.
CONFIG_NORDIC_HV_REGOUT0_3V3=y

# RAK4631 has an nRF52840 BLE controller. Keep Bluetooth board-local so
# STM32WL-based profiles do not pull in unsupported radio/controller code.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_BT_DEVICE_NAME="RTBus RTDuo"
CONFIG_BT_DEVICE_APPEARANCE=0

CONFIG_RTBUS_LIB=y
