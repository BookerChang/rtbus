# RAK4200 is an STM32L0 target. Keep this profile minimal until board pins are
# verified from the module schematic.
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE=""
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE_HANDLER=y
CONFIG_CONSOLE_INPUT_MAX_LINE_LEN=512
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_NVS=y

CONFIG_BT=n


CONFIG_RTBUS_IMAGE_RAM_MAX=1024
CONFIG_RTBUS_LIB=y
CONFIG_RUNTIME_POOL_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_RTBUS_NATIVE_API_TABLE_BASE=0x20004F00

CONFIG_NORDIC_HV_REGOUT0_3V3=n

# RTBus upstream baseline: downstream transports are provided by overlays.
CONFIG_BT=n
CONFIG_RTBUS_LIB=y
