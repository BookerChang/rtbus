# RAK11720 uses the Apollo3 UART console.
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE_HANDLER=y
CONFIG_CONSOLE_INPUT_MAX_LINE_LEN=1024
CONFIG_GPIO=y

# Keep BLE disabled until the RAK11720 runtime service path is validated.
CONFIG_BT=n


CONFIG_RTBUS_IMAGE_RAM_MAX=8192
CONFIG_RTBUS_LIB=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_WISNODEZ_API_TABLE_BASE=0x1005FF00

CONFIG_NORDIC_HV_REGOUT0_3V3=n

# RTBus upstream baseline: downstream transports are provided by overlays.
CONFIG_BT=n
CONFIG_RTBUS_LIB=y
