# RAK3172P uses an STM32WL UART console instead of nRF USB CDC ACM.
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y

# AT CLI runs on the selected UART console.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE_HANDLER=y
CONFIG_CONSOLE_INPUT_MAX_LINE_LEN=1024
CONFIG_GPIO=y

# RAK3172P is STM32WL and has no Bluetooth controller.
CONFIG_BT=n


# RAK3172P keeps LoRaWAN, EMOS scheduler, UART AT CLI and native application
# service enabled, while feature-heavy upgrade paths remain disabled until the
# STM32WL flash/RAM layout is finalized.
CONFIG_RTBUS_IMAGE_RAM_MAX=4096
CONFIG_RTBUS_LIB=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_WISNODEZ_API_TABLE_BASE=0x2000FF00

# RAK3172P is STM32WL, not Nordic VDDH/HV.
CONFIG_NORDIC_HV_REGOUT0_3V3=n

# RTBus upstream baseline: downstream transports are provided by overlays.
CONFIG_BT=n
CONFIG_RTBUS_LIB=y
