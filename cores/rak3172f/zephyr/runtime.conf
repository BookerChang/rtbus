# RAK3172F uses an STM32WL UART console instead of nRF USB CDC ACM.
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_SCRATCH=y

# AT CLI runs on the selected UART console.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE_HANDLER=y
CONFIG_CONSOLE_INPUT_MAX_LINE_LEN=1024
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_GPIO_HOGS=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FLASH_JESD216_API=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=4

# RAK3172F is STM32WL and has no Bluetooth controller.
CONFIG_BT=n


# RAK3172F keeps LoRaWAN, EMOS scheduler, UART AT CLI and native application
# service enabled. Patch payload staging uses external SPI NOR patch_partition
# instead of shared_upgrade_ram.
CONFIG_WISMOD_FW_COMPONENT_LIB=y
CONFIG_WISMOD_FW_COMPONENT_RAM_MAX=4096
CONFIG_WISMOD_FW_COMPONENT_STORE_DIRECT_FLASH=y
CONFIG_RTBUS_LIB=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_WISNODEZ_API_TABLE_BASE=0x2000FF00
CONFIG_WISNODEZ_OTA_SHARED_DATA_ADDR=0x2000F400

# RAK3172F is STM32WL, not Nordic VDDH/HV.
CONFIG_NORDIC_HV_REGOUT0_3V3=n

# RTBus upstream baseline: downstream transports are provided by overlays.
CONFIG_BT=n
CONFIG_WISMOD_FW_COMPONENT_LIB=y
CONFIG_RTBUS_LIB=y
